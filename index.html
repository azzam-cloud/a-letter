  mu.style.display='block';mu.textContent='♪ ON';
}
mu.onclick=e=>{e.stopPropagation();if(!aud)return;aud.muted=!aud.muted;mu.textContent=aud.muted?'♪ OFF':'♪ ON'};
function playMiaw(){
  const meow=new Audio('song/miaw.mp3');
  meow.volume=.42;
  meow.play().catch(()=>{});
}
function start(){
  if(aud){aud.pause();aud=null}mu.style.display='none';
  stage.classList.add('resetting');
  $('guard').style.left='-70px';$('cat').style.left='112%';
  requestAnimationFrame(()=>stage.classList.remove('resetting'));
  queue=M.map(x=>({...x,m:1}));done_=0;busy=false;next();
  history=[];backBtn.style.display='none';
}
function restartWithFade(){
  busy=true;fade.classList.add('on');
  const oldAud=aud,started=performance.now();
  const fadeAudio=()=>{const p=Math.min(1,(performance.now()-started)/650);if(oldAud)oldAud.volume=.55*(1-p);if(p<1)requestAnimationFrame(fadeAudio)};
  fadeAudio();
  setTimeout(()=>{start();requestAnimationFrame(()=>fade.classList.remove('on'))},700);
}
function next(){
  if(busy||!queue.length)return;
  if(cur&&!cur.ev)history.push({item:cur,rest:[...queue],done:done_});
  cur=queue.shift();clearInterval(timer);
  backBtn.style.display=history.length?'inline-block':'none';
  if(cur.m)done_++;
  bar.style.transform="scaleX("+(done_/M.length)+")";
  if(cur.ev){EV[cur.ev]();busy=true;nx.style.display="none";setTimeout(()=>{busy=false;next()},cur.d||0);return}
  txt.textContent="";ch.innerHTML="";nx.style.display="none";
  if(cur.c){
    setWho(H);txt.textContent=cur.c[0].end?"":"Choose Ms. Quack's reply:";
    typing=false;
    cur.c.forEach(o=>{
      const b=document.createElement('button');b.textContent=o.l;
      if(o.tag){const s=document.createElement('small');s.textContent=o.tag;b.appendChild(s)}
      b.onclick=e=>{e.stopPropagation();if(o.end){restartWithFade();return}
        if(o.fn)o.fn();queue.unshift(...o.a.map(x=>({...x})));next()};
      ch.appendChild(b);
    });
  }else{
    setWho(cur.w);if(cur.fn)cur.fn();if(cur.h)burst();typeIt(cur.t);
  }
}
function goBack(){
  if(!history.length||busy)return;
  clearInterval(timer);typing=false;
  const previous=history.pop();
  queue=[previous.item,...previous.rest];cur=null;done_=previous.done;
  bar.style.transform="scaleX("+(done_/M.length)+")";
  backBtn.style.display=history.length?'inline-block':'none';
  next();
}
backBtn.onclick=e=>{e.stopPropagation();goBack()};
function setWho(w){
  nm.textContent=w;nm.dataset.s=w;
  pt.innerHTML=POR[w]?POR[w]():"🌙";
  him.classList.toggle('dim',w===H);her.classList.toggle('dim',w===Q);
  him.classList.remove('talking');her.classList.remove('talking');
  him.classList.remove('shy','listening','happy');her.classList.remove('shy','listening','happy');
  pt.classList.remove('shy','listening','happy');
}
function typeTick(){
  if(!typingAudio)return;
  const o=typingAudio.createOscillator(),g=typingAudio.createGain();
  o.type='square';o.frequency.value=720+Math.random()*90;
  g.gain.setValueAtTime(.0001,typingAudio.currentTime);
  g.gain.exponentialRampToValueAtTime(.012,typingAudio.currentTime+.003);
  g.gain.exponentialRampToValueAtTime(.0001,typingAudio.currentTime+.035);
  o.connect(g).connect(typingAudio.destination);o.start();o.stop(typingAudio.currentTime+.04);
}
function typeIt(t){
  typing=true;let k=0;
  if(cur.w===Q)him.classList.add('talking');if(cur.w===H)her.classList.add('talking');
  const expression=cur.w===Q&&cur.h?'shy':cur.w===H?'listening':'happy';
  if(cur.w===Q){him.classList.add(expression);pt.classList.add(expression)}
  if(cur.w===H){her.classList.add(expression);pt.classList.add(expression)}
  if(!typingAudio){try{typingAudio=new (window.AudioContext||window.webkitAudioContext)()}catch(e){}}
  if(typingAudio&&typingAudio.state==='suspended')typingAudio.resume().catch(()=>{});
  timer=setInterval(()=>{k++;txt.textContent=t.slice(0,k);body.scrollTop=body.scrollHeight;if(k%2===0)typeTick();if(k>=t.length)finish()},22);
}
function finish(){clearInterval(timer);typing=false;him.classList.remove('talking');her.classList.remove('talking');if(cur.t)txt.textContent=cur.t;nx.style.display="block"}
function burst(){
  for(let j=0;j<6;j++){const h=document.createElement('span');h.textContent=j%2?"💛":"❤️";
    h.style.left=(35+Math.random()*30)+"%";h.style.animationDelay=(j*.3)+"s";hearts.appendChild(h);setTimeout(()=>h.remove(),3600)}
}
function advance(){if(busy)return;if(typing){finish();return}if(cur&&cur.c)return;next()}
box.addEventListener('click',advance);
box.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();advance()}});
$('app').classList.add('intro-active');
$('continueBtn').onclick=()=>{$('app').classList.remove('intro-active');start()};
</script>
</body>
</html>
